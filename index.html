<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Discussion App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>Discussion Portal</header>
  
  <div class="container">
    <!-- Left Pane -->
    <div class="left-pane">
      <div class="left-controls">
        <button class="btn-primary" id="newQuestionBtn">New Question form</button>
        <input type="text" id="searchInput" class="search-box" placeholder="Search questions..." />
      </div>
      <div class="question-list" id="questionList"></div>
    </div>

    <!-- Right Pane -->
    <div class="right-pane" id="rightPane">
      <!-- Injected via JavaScript -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
